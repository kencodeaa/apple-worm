<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sâu Ăn Táo - Neon Dark Edition</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #131b2e;
            --border-color: #1e293b;
            --accent-green: #10b981;
            --accent-green-glow: rgba(16, 185, 129, 0.45);
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
            padding: 10px;
        }

        .game-container {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 440px;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .title-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent-green);
            text-shadow: 0 0 12px var(--accent-green-glow);
        }

        .mode-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-muted);
            cursor: pointer;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 6px;
            width: fit-content;
        }

        .mode-toggle.active {
            color: var(--accent-green);
            border-color: rgba(16, 185, 129, 0.5);
        }

        .scores {
            display: flex;
            gap: 10px;
        }

        .score-box {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 5px 12px;
            border-radius: 10px;
            text-align: center;
            min-width: 68px;
        }

        .score-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.8px;
        }

        .score-value {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .canvas-wrapper.wrap-border {
            border-style: dashed;
            border-color: rgba(16, 185, 129, 0.45);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #080b12;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(11, 15, 25, 0.86);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-align: center;
            padding: 20px;
            transition: opacity 0.2s ease;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay h2 {
            font-size: 1.6rem;
            color: var(--text-main);
        }

        .overlay p {
            font-size: 0.88rem;
            color: var(--text-muted);
            max-width: 270px;
            line-height: 1.4;
        }

        .btn {
            background: var(--accent-green);
            color: #042f2e;
            border: none;
            padding: 11px 26px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--accent-green-glow);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 28px rgba(16, 185, 129, 0.7);
        }

        .btn:active {
            transform: scale(0.97);
        }

        /* Cụm nút điều khiển D-Pad cho điện thoại */
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 58px);
            grid-template-rows: repeat(2, 54px);
            gap: 8px;
            margin-top: 2px;
        }

        .dpad-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
            transition: background 0.1s, border-color 0.1s, transform 0.08s;
        }

        .dpad-btn:active, .dpad-btn.pressed {
            background: rgba(16, 185, 129, 0.2);
            border-color: var(--accent-green);
            color: var(--accent-green);
            transform: scale(0.93);
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        .controls-hint {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
        }

        @media (max-width: 600px) {
            .controls-hint {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header">
            <div class="title-group">
                <div class="title">🐍 SÂU ĂN TÁO</div>
                <button class="mode-toggle active" id="wrap-toggle" title="Bật/tắt đi xuyên tường">
                    🌀 Xuyên tường: <strong id="wrap-status">BẬT</strong>
                </button>
            </div>
            <div class="scores">
                <div class="score-box">
                    <div class="score-label">Điểm</div>
                    <div class="score-value" id="score">0</div>
                </div>
                <div class="score-box">
                    <div class="score-label">Kỷ lục</div>
                    <div class="score-value" id="high-score">0</div>
                </div>
            </div>
        </div>

        <div class="canvas-wrapper wrap-border" id="canvas-wrapper">
            <canvas id="gameCanvas" width="440" height="440"></canvas>
            
            <div class="overlay" id="overlay">
                <h2 id="overlay-title">Sẵn sàng?</h2>
                <p id="overlay-desc">Chế độ xuyên tường đang BẬT. Cẩn thận đừng tự cắn vào thân mình!</p>
                <button class="btn" id="start-btn">Bắt đầu chơi</button>
            </div>
        </div>

        <!-- Cụm nút điều khiển cho điện thoại -->
        <div class="dpad">
            <button class="dpad-btn btn-up" data-dir="up" aria-label="Lên">▲</button>
            <button class="dpad-btn btn-left" data-dir="left" aria-label="Trái">◀</button>
            <button class="dpad-btn btn-down" data-dir="down" aria-label="Xuống">▼</button>
            <button class="dpad-btn btn-right" data-dir="right" aria-label="Phải">▶</button>
        </div>

        <div class="controls-hint">
            Bàn phím: Mũi tên / WASD • Space để tạm dừng
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const canvasWrapper = document.getElementById('canvas-wrapper');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('high-score');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');
        const startBtn = document.getElementById('start-btn');
        const wrapToggle = document.getElementById('wrap-toggle');
        const wrapStatus = document.getElementById('wrap-status');

        const GRID_SIZE = 20;
        const TILE_COUNT = canvas.width / GRID_SIZE;

        let snake = [];
        let apple = { x: 15, y: 15 };
        let dx = 0;
        let dy = 0;
        let nextDx = 0;
        let nextDy = 0;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('snake_high_score')) || 0;
        let gameLoop = null;
        let gameSpeed = 120;
        let isRunning = false;
        let isPaused = false;
        let wrapWalls = true; // Mặc định bật xuyên tường

        highScoreEl.textContent = highScore;

        // Bật / Tắt chế độ xuyên tường
        wrapToggle.addEventListener('click', () => {
            wrapWalls = !wrapWalls;
            wrapStatus.textContent = wrapWalls ? 'BẬT' : 'TẮT';
            wrapToggle.classList.toggle('active', wrapWalls);
            canvasWrapper.classList.toggle('wrap-border', wrapWalls);
            if (!isRunning) {
                overlayDesc.textContent = wrapWalls
                    ? 'Chế độ xuyên tường đang BẬT. Cẩn thận đừng tự cắn vào thân mình!'
                    : 'Chế độ tường cứng đang BẬT. Đâm vào tường hoặc thân sẽ thua!';
            }
        });

        // Web Audio API tạo hiệu ứng âm thanh
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function initGame() {
            snake = [
                { x: 10, y: 11 },
                { x: 9, y: 11 },
                { x: 8, y: 11 }
            ];
            dx = 1;
            dy = 0;
            nextDx = 1;
            nextDy = 0;
            score = 0;
            gameSpeed = 120;
            isRunning = true;
            isPaused = false;
            scoreEl.textContent = score;
            startBtn.style.display = 'inline-block';
            spawnApple();
            overlay.classList.add('hidden');
            
            if (gameLoop) clearTimeout(gameLoop);
            runGame();
        }

        function spawnApple() {
            let valid = false;
            while (!valid) {
                apple.x = Math.floor(Math.random() * TILE_COUNT);
                apple.y = Math.floor(Math.random() * TILE_COUNT);
                valid = !snake.some(segment => segment.x === apple.x && segment.y === apple.y);
            }
        }

        function runGame() {
            if (!isRunning) return;
            if (!isPaused) {
                update();
                draw();
            }
            gameLoop = setTimeout(runGame, gameSpeed);
        }

        function update() {
            dx = nextDx;
            dy = nextDy;

            let nextX = snake[0].x + dx;
            let nextY = snake[0].y + dy;

            if (wrapWalls) {
                // Xử lý đi xuyên tường sang cạnh đối diện
                if (nextX < 0) nextX = TILE_COUNT - 1;
                else if (nextX >= TILE_COUNT) nextX = 0;

                if (nextY < 0) nextY = TILE_COUNT - 1;
                else if (nextY >= TILE_COUNT) nextY = 0;
            } else {
                // Kiểm tra va chạm tường cứng
                if (nextX < 0 || nextX >= TILE_COUNT || nextY < 0 || nextY >= TILE_COUNT) {
                    gameOver();
                    return;
                }
            }

            const head = { x: nextX, y: nextY };

            // Kiểm tra va chạm thân
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            // Kiểm tra ăn táo
            if (head.x === apple.x && head.y === apple.y) {
                score += 10;
                scoreEl.textContent = score;
                playTone(540, 'sine', 0.11);
                
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.textContent = highScore;
                    localStorage.setItem('snake_high_score', highScore);
                }

                if (gameSpeed > 55) {
                    gameSpeed -= 2;
                }
                spawnApple();
            } else {
                snake.pop();
            }
        }

        function draw() {
            ctx.fillStyle = '#080b12';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Vẽ lưới nền
            ctx.strokeStyle = 'rgba(30, 41, 59, 0.35)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= TILE_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(i * GRID_SIZE, 0);
                ctx.lineTo(i * GRID_SIZE, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * GRID_SIZE);
                ctx.lineTo(canvas.width, i * GRID_SIZE);
                ctx.stroke();
            }

            // Vẽ quả táo
            const appleX = apple.x * GRID_SIZE + GRID_SIZE / 2;
            const appleY = apple.y * GRID_SIZE + GRID_SIZE / 2;
            ctx.save();
            ctx.shadowColor = '#ef4444';
            ctx.shadowBlur = 14;
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(appleX, appleY, GRID_SIZE / 2 - 2, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(appleX - 1, apple.y * GRID_SIZE + 1, 4, 3);
            ctx.restore();

            // Vẽ con sâu
            snake.forEach((segment, index) => {
                const isHead = index === 0;
                ctx.save();
                if (isHead) {
                    ctx.shadowColor = '#10b981';
                    ctx.shadowBlur = 12;
                    ctx.fillStyle = '#34d399';
                } else {
                    const alpha = Math.max(0.45, 1 - index / (snake.length + 5));
                    ctx.fillStyle = `rgba(16, 185, 129, ${alpha})`;
                }

                const pad = isHead ? 1 : 2;
                roundRect(
                    ctx,
                    segment.x * GRID_SIZE + pad,
                    segment.y * GRID_SIZE + pad,
                    GRID_SIZE - pad * 2,
                    GRID_SIZE - pad * 2,
                    isHead ? 6 : 4
                );
                ctx.fill();

                if (isHead) {
                    ctx.fillStyle = '#042f2e';
                    const eyeOffsetX = dx === 1 ? 13 : dx === -1 ? 4 : 5;
                    const eyeOffsetY = dy === 1 ? 13 : dy === -1 ? 4 : 5;
                    
                    ctx.beginPath();
                    ctx.arc(segment.x * GRID_SIZE + eyeOffsetX, segment.y * GRID_SIZE + eyeOffsetY, 2, 0, Math.PI * 2);
                    if (dx !== 0) {
                        ctx.arc(segment.x * GRID_SIZE + eyeOffsetX, segment.y * GRID_SIZE + 14, 2, 0, Math.PI * 2);
                    } else {
                        ctx.arc(segment.x * GRID_SIZE + 14, segment.y * GRID_SIZE + eyeOffsetY, 2, 0, Math.PI * 2);
                    }
                    ctx.fill();
                }
                ctx.restore();
            });
        }

        function roundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        function gameOver() {
            isRunning = false;
            playTone(160, 'sawtooth', 0.3);
            overlayTitle.textContent = 'Thua rồi!';
            overlayDesc.textContent = `Bạn đạt được ${score} điểm. Nhấn nút bên dưới để thử lại.`;
            startBtn.style.display = 'inline-block';
            startBtn.textContent = 'Chơi lại';
            overlay.classList.remove('hidden');
        }

        function setDirection(dir) {
            if (!isRunning || isPaused) return;
            if (dir === 'up' && dy !== 1) {
                nextDx = 0; nextDy = -1;
            } else if (dir === 'down' && dy !== -1) {
                nextDx = 0; nextDy = 1;
            } else if (dir === 'left' && dx !== 1) {
                nextDx = -1; nextDy = 0;
            } else if (dir === 'right' && dx !== -1) {
                nextDx = 1; nextDy = 0;
            }
        }

        // Sự kiện bấm nút D-Pad trên màn hình
        document.querySelectorAll('.dpad-btn').forEach(btn => {
            const dir = btn.dataset.dir;
            const handlePress = (e) => {
                e.preventDefault();
                setDirection(dir);
            };
            btn.addEventListener('touchstart', handlePress, { passive: false });
            btn.addEventListener('mousedown', handlePress);
        });

        // Điều khiển bàn phím
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && isRunning) {
                isPaused = !isPaused;
                if (isPaused) {
                    overlayTitle.textContent = 'Tạm dừng';
                    overlayDesc.textContent = 'Nhấn Space để tiếp tục trò chơi.';
                    startBtn.style.display = 'none';
                    overlay.classList.remove('hidden');
                } else {
                    startBtn.style.display = 'inline-block';
                    overlay.classList.add('hidden');
                }
                return;
            }

            const key = e.key.toLowerCase();
            if (key === 'arrowup' || key === 'w') setDirection('up');
            else if (key === 'arrowdown' || key === 's') setDirection('down');
            else if (key === 'arrowleft' || key === 'a') setDirection('left');
            else if (key === 'arrowright' || key === 'd') setDirection('right');
        });

        // Hỗ trợ vuốt cảm ứng trên vùng chơi
        let touchStartX = 0;
        let touchStartY = 0;
        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        canvas.addEventListener('touchend', (e) => {
            if (!isRunning || isPaused) return;
            const diffX = e.changedTouches[0].clientX - touchStartX;
            const diffY = e.changedTouches[0].clientY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 20) setDirection('right');
                else if (diffX < -20) setDirection('left');
            } else {
                if (diffY > 20) setDirection('down');
                else if (diffY < -20) setDirection('up');
            }
        }, { passive: true });

        startBtn.addEventListener('click', initGame);

        draw();
    </script>
</body>
</html>
